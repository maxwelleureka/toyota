/car/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


/car/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    extra_joints: ["front_left_wheel_joint", "front_right_wheel_joint"]
    frame_id: base_link


/car/ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 2.0
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: false
    traction_joints_names: [rear_left_wheel_joint, rear_right_wheel_joint]
    steering_joints_names: [front_left_steering_joint, front_right_steering_joint]
    base_frame_id: base_footprint
    wheelbase: 2.45
    front_wheel_track: 1.6
    rear_wheel_track: 1.6
    traction_wheels_radius: 0.3